[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agronova-workshop"
version = "2.0.0"
description = "Material didáctico de Data & IA: caso ficticio AgroNova con datos sintéticos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0"]

[project.scripts]
agronova = "agronova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
